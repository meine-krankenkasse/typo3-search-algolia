name: Semgrep

on:
    push:
        branches:
            - main
    pull_request:
    schedule:
        # CodeQL does not support PHP, this is the PHP-covering equivalent
        # of a scheduled code-scanning run for this repository.
        -   cron: '0 5 * * 1'

permissions:
    contents: read

jobs:
    semgrep:
        name: Semgrep scan
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            security-events: write
            actions: read

        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
                with:
                    egress-policy: audit

            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup Python
                uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                with:
                    python-version: '3.x'

            -   name: Install Semgrep
                run: pip install semgrep==1.176.1

            -   name: Run Semgrep
                run: |
                    semgrep scan \
                      --config p/php \
                      --config p/security-audit \
                      --config p/secrets \
                      --sarif \
                      --output=semgrep-results.sarif

            -   name: Upload SARIF results to the Security tab
                uses: github/codeql-action/upload-sarif@a45bef097606dca6eac8285c279babedd70e6dfd # v3.37.9
                with:
                    sarif_file: semgrep-results.sarif
