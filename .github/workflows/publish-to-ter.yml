name: Publish new extension version to TER

on:
    release:
        types: [ published ]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Git tag to (re)publish, e.g. 1.3.1 (must already exist)'
                required: true
                type: string

permissions: {}

jobs:
    publish:
        name: Publish new version to TER
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read

        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
                with:
                    egress-policy: audit

            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false
                    ref: ${{ github.event.inputs.tag || github.ref }}

            -   name: Resolve extension key from composer.json
                id: extkey
                run: |
                    KEY=$(jq -r '.extra["typo3/cms"]["extension-key"] // empty' composer.json)
                    if [[ -z "${KEY}" ]]; then
                      echo "::error file=composer.json::Missing extension-key in extra.typo3/cms"
                      exit 1
                    fi
                    echo "key=${KEY}" >> "$GITHUB_OUTPUT"
                    echo "Extension key: ${KEY}"

            -   name: Resolve target version
                id: version
                env:
                    DISPATCH_TAG: ${{ github.event.inputs.tag }}
                run: |
                    # This repo's existing tags (1.0.0 .. 1.3.1) have no "v" prefix - match that convention.
                    # DISPATCH_TAG is set on a manual workflow_dispatch re-run (GITHUB_REF_NAME would be the
                    # branch the workflow was dispatched against, not the tag to publish); empty on a normal
                    # release-published run, where GITHUB_REF_NAME already is the tag name.
                    VERSION="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
                    if ! [[ "${VERSION}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
                      echo "::error::Invalid tag format '${VERSION}'. Expected format: 1.2.3"
                      exit 1
                    fi
                    echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                    echo "Target version: ${VERSION}"

            -   name: Validate ext_emconf.php version
                env:
                    TAG_VERSION: ${{ steps.version.outputs.version }}
                run: |
                    EMCONF_VERSION=$(grep -oP "'version'\s*=>\s*'\K[^']+" ext_emconf.php)
                    if [[ "${TAG_VERSION}" != "${EMCONF_VERSION}" ]]; then
                      echo "::error file=ext_emconf.php::Tag version (${TAG_VERSION}) does not match ext_emconf.php version (${EMCONF_VERSION}). Update ext_emconf.php before tagging."
                      exit 1
                    fi
                    echo "Version validated: ${TAG_VERSION} matches ext_emconf.php"

            -   name: Prepare release comment
                id: comment
                env:
                    RELEASE_BODY: ${{ github.event.release.body }}
                    RELEASE_NAME: ${{ github.event.release.name }}
                    RELEASE_URL: ${{ github.event.release.html_url }}
                    VERSION: ${{ steps.version.outputs.version }}
                    SERVER_URL: ${{ github.server_url }}
                    REPO: ${{ github.repository }}
                run: |
                    # 0. Prefer the CHANGELOG.md section for this version - curated,
                    # committed, and present even on a workflow_dispatch re-run (which
                    # has no github.event.release.* context at all). This repo's
                    # CHANGELOG.md uses a single "# 1.2.3" heading per version (no
                    # brackets, no date); "## MISC"/"## Contributors" are sub-sections
                    # within it, not version boundaries, so only a bare "# " prefix
                    # (not "## ") marks the next version and ends the section.
                    COMMENT=""
                    if [[ -f CHANGELOG.md ]]; then
                      COMMENT=$(awk -v ver="${VERSION}" '
                        /^# / {
                          if (found) { exit }
                          line = $0
                          sub(/^# */, "", line)
                          if (line == ver) { found = 1 }
                          next
                        }
                        found { print }
                      ' CHANGELOG.md | sed -e '/./,$!d')
                    fi

                    # 1. Otherwise the GitHub release body (empty on workflow_dispatch)
                    if [[ -z "${COMMENT// }" ]] && [[ -n "${RELEASE_BODY}" ]]; then
                      COMMENT="${RELEASE_BODY}"
                    fi

                    # 2. Otherwise the release title
                    if [[ -z "${COMMENT// }" ]] && [[ -n "${RELEASE_NAME}" ]]; then
                      COMMENT="${RELEASE_NAME}"
                    fi

                    # 3. Bare fallback
                    if [[ -z "${COMMENT// }" ]]; then
                      COMMENT="Release ${VERSION}"
                    fi

                    # Character-safe truncation - `head -c` splits multi-byte UTF-8
                    # sequences (umlauts, em-dashes, emoji) mid-codepoint
                    COMMENT=$(printf '%s' "${COMMENT}" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:1000])')

                    # Strip characters not supported in TER XML export
                    COMMENT=$(printf '%s' "${COMMENT}" | sed 's/[#*+=~^|\\<>]//g')

                    if [[ -z "${RELEASE_URL}" ]]; then
                      RELEASE_URL="${SERVER_URL}/${REPO}/releases/tag/${VERSION}"
                    fi

                    COMMENT="${COMMENT}

                    Details: ${RELEASE_URL}"

                    # Randomized delimiter - a static "EOF" could be smuggled into
                    # $GITHUB_OUTPUT by a comment source that happens to contain that
                    # exact line, ending the heredoc early
                    DELIMITER="ghadelim_$(openssl rand -hex 8)"
                    {
                      echo "comment<<${DELIMITER}"
                      echo "${COMMENT}"
                      echo "${DELIMITER}"
                    } >> "$GITHUB_OUTPUT"

            -   name: Check if version is already on TER
                id: precheck
                env:
                    KEY: ${{ steps.extkey.outputs.key }}
                    VERSION: ${{ steps.version.outputs.version }}
                    EVENT_NAME: ${{ github.event_name }}
                run: |
                    if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
                      # The whole point of a manual re-run is usually to correct
                      # something (e.g. the upload comment) on an already-published
                      # version. TER accepts a re-upload of the same version number
                      # and just overwrites the stored comment, so forcing past the
                      # precheck here is safe, not a duplicate-publish risk.
                      echo "already-published=false" >> "$GITHUB_OUTPUT"
                      echo "Manual re-run - publishing ${VERSION} regardless of TER state"
                      exit 0
                    fi

                    URL="https://extensions.typo3.org/extension/download/${KEY}/${VERSION}/zip"
                    STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -I --max-time 15 "${URL}" || echo "000")
                    if [[ "${STATUS}" == "200" ]]; then
                      echo "already-published=true" >> "$GITHUB_OUTPUT"
                      echo "Version ${VERSION} is already on TER - skipping publish"
                    else
                      echo "already-published=false" >> "$GITHUB_OUTPUT"
                      echo "TER precheck status for ${VERSION}: ${STATUS} (will publish)"
                    fi

            -   name: Setup PHP
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: '8.3'
                    extensions: intl, mbstring, json, zip, curl
                    tools: composer:v2

            -   name: Install tailor
                run: composer global require typo3/tailor --prefer-dist --no-progress

            -   name: Publish to TER
                if: steps.precheck.outputs.already-published != 'true'
                env:
                    EXTENSION_KEY: ${{ steps.extkey.outputs.key }}
                    TYPO3_API_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
                    VERSION: ${{ steps.version.outputs.version }}
                    COMMENT: ${{ steps.comment.outputs.comment }}
                run: |
                    TAILOR="$(composer global config bin-dir --absolute)/tailor"
                    "${TAILOR}" ter:publish --comment="${COMMENT}" "${VERSION}" "${EXTENSION_KEY}"

            -   name: Verify TER serves the version
                env:
                    KEY: ${{ steps.extkey.outputs.key }}
                    VERSION: ${{ steps.version.outputs.version }}
                run: |
                    URL="https://extensions.typo3.org/extension/download/${KEY}/${VERSION}/zip"
                    TIMEOUT_MINUTES=10
                    POLL_INTERVAL=30
                    DEADLINE=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
                    ATTEMPT=0
                    while true; do
                      ATTEMPT=$((ATTEMPT + 1))
                      STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -I --max-time 15 "${URL}" || echo "000")
                      if [[ "${STATUS}" == "200" ]]; then
                        echo "TER serves ${VERSION} (attempt ${ATTEMPT})"
                        exit 0
                      fi
                      if [[ $(date +%s) -ge ${DEADLINE} ]]; then
                        echo "::error::Timed out waiting for TER to serve ${VERSION} (last status: ${STATUS})"
                        exit 1
                      fi
                      echo "Attempt ${ATTEMPT}: status ${STATUS}, retrying in ${POLL_INTERVAL}s"
                      sleep "${POLL_INTERVAL}"
                    done

            -   name: Update TER metadata
                env:
                    KEY: ${{ steps.extkey.outputs.key }}
                    TYPO3_API_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
                run: |
                    TAILOR="$(composer global config bin-dir --absolute)/tailor"
                    # --manual intentionally points to GitHub, not left empty: this
                    # extension's Documentation/ has no guides.xml/RST, so
                    # docs.typo3.org never renders it and the auto-link would 404
                    # (same situation as netresearch/t3x-universal-messenger's
                    # skip-docs flag).
                    "${TAILOR}" ter:update \
                      --composer="meine-krankenkasse/typo3-search-algolia" \
                      --manual="https://github.com/meine-krankenkasse/typo3-search-algolia" \
                      --issues="https://github.com/meine-krankenkasse/typo3-search-algolia/issues" \
                      --repository="https://github.com/meine-krankenkasse/typo3-search-algolia" \
                      "${KEY}"
