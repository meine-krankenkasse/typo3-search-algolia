<html data-namespace-typo3-fluid="true"
      xmlns="http://www.w3.org/1999/xhtml" lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>
    <f:layout name="Module" />

    <f:section name="Content">
        <div class="col-md-12">
            <h1><f:translate key="module.name" /></h1>
            <h2><f:translate key="attribute_overview" /></h2>

            <p>
                <f:translate key="attribute_overview.record_types_checked" />
                <f:for each="{recordTypes}" as="recordType" iteration="typeIter"><code>{recordType}</code>{f:if(condition: typeIter.isLast, else: ', ')}</f:for>
            </p>

            <f:if condition="{tableStatuses}">
                <div class="mt-4">
                    <h3 class="mb-3"><f:translate key="attribute_overview.status.heading" /></h3>
                    <ul>
                        <f:for each="{tableStatuses}" as="status" key="table">
                            <li>
                                <code>{table}</code>:
                                <f:switch expression="{status.type}">
                                    <f:case value="no_indexing_service">
                                        <f:translate key="attribute_overview.section.no_indexing_service" />
                                    </f:case>
                                    <f:case value="no_record_in_scope">
                                        <f:translate key="attribute_overview.section.no_record_in_scope" />
                                    </f:case>
                                    <f:case value="error">
                                        <f:translate key="attribute_overview.section.error" arguments="{0: status.message}" />
                                    </f:case>
                                </f:switch>
                            </li>
                        </f:for>
                    </ul>
                </div>
            </f:if>

            <table class="table table-striped mt-4">
                <thead>
                    <tr>
                        <th><f:translate key="attribute_overview.table.header.attribute" /></th>
                        <th><f:translate key="attribute_overview.table.header.occurs_on" /></th>
                        <th><f:translate key="attribute_overview.table.header.example_value" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{attributeRows}" as="row" key="attributeName">
                        <tr>
                            <td><code>{attributeName}</code></td>
                            <td>
                                <f:for each="{row.occurrences}" as="occurrence" key="table">
                                    <div>
                                        <span class="badge">{occurrence.origin}</span>
                                        <code>{table}</code>
                                        <f:if condition="{occurrence.detail}">
                                            <code class="ms-2">{occurrence.detail}</code>
                                        </f:if>
                                    </div>
                                </f:for>
                            </td>
                            <td>{row.exampleValue}</td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </div>
    </f:section>
</html>
